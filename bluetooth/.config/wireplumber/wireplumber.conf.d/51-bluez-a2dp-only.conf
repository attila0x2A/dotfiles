# The MT7925 chip sends corrupted SCO packets in headset mode (HFP),
# which disconnects the headphones. Keep Bluetooth audio in A2DP mode.
# The laptop microphone records audio in calls.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  # Prefer SBC-XQ. AAC gave no better results with the REDMI Buds.
  bluez5.codecs = [ sbc_xq sbc ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
