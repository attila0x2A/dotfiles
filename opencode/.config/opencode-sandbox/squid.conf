http_port 3128

acl allowed_dst dstdomain .deepseek.com

acl dev_dsts dstdomain .github.com .githubusercontent.com .gitlab.com
acl dev_dsts dstdomain .crates.io .docs.rs
acl dev_dsts dstdomain .npmjs.com .pypi.org
acl dev_dsts dstdomain .rust-lang.org .python.org
acl dev_dsts dstdomain .stackoverflow.com .stackexchange.com
acl dev_dsts dstdomain .reddit.com
acl dev_dsts dstdomain .neovim.io .nvim-lua.org
acl dev_dsts dstdomain .lua.org .luarocks.org
acl dev_dsts dstdomain .opencode.ai

acl pkg_dsts dstdomain .archlinux.org

http_access allow allowed_dst
http_access allow pkg_dsts
http_access allow dev_dsts
# allow CONNECT for HTTPS to allowed domains
http_access allow CONNECT allowed_dst
http_access allow CONNECT dev_dsts
http_access allow CONNECT pkg_dsts

http_access deny all
